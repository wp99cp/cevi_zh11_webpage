name: Build Jekyll Page

on:
  push:
    branches: [ master ]

    # Frontend will not be rebuild if only backend changed
    paths-ignore:
      - backend/*

  # enable manuall workflow triggering via GitHub web interface
  workflow_dispatch:

jobs:
  jekyll_preview:
    name: Build and deploy Jekyll site
    runs-on: ubuntu-latest

    # A complete build of every image takes a bit over an hour; anything much
    # beyond that is stuck rather than slow.
    timeout-minutes: 120

    steps:
      # Checkout the source code
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Used downstream for building the jekyll page. The layers are cached in
      # the GitHub Actions cache, so the image is only really rebuilt when the
      # Dockerfile or the Gemfile changes.
      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jeykell-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # fetch and encrypt access credentials for Google Drive
      - name: Retrieve the secret and decode it to a file
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo $API_KEY > ./_secrets/credentials.json

      # We cache static resources, i.g. optimized images and documents as well as
      # the _site folder and .jekyll-cache directory
      # Make sure to NOT cache the `_secrets` directory, it contains the Google Drive Access Credentials!
      #
      # A miss here is no longer expensive: images that are missing locally are
      # fetched from the copies already published on the live site, and only the
      # ones that genuinely changed are rebuilt. See _plugins/utils/.
      #
      # Restoring and saving are split so that a new copy is only uploaded when
      # the images actually changed - see the save step at the end for why.
      - name: ⛏️ Restore static files from cache
        uses: actions/cache/restore@v4
        with:
          path: |
            imgs
            google_drive_cache
            docs
          key: ${{ runner.os }}-static-files-v4-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-static-files-v4-

      - name: Fingerprint the restored cache
        id: cache-before
        run: echo "fingerprint=$(./bin/fingerprint-cached-files.sh)" >> "$GITHUB_OUTPUT"

      # Build the jekyll page.
      #
      # The container runs as the runner's own user so that the files it writes
      # into the mounted directory stay readable by the later steps. The previous
      # `chmod -R 777 $PWD` did the same job by rewriting the mode of every file
      # in the repository, which also quietly marked checked-in files executable.
      - name: Build 🏗️
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --volume="$PWD:/srv/jekyll" \
            -e GITHUB_SHA=$GITHUB_SHA \
            jeykell-builder

      - name: Fingerprint the cache after the build
        id: cache-after
        run: echo "fingerprint=$(./bin/fingerprint-cached-files.sh)" >> "$GITHUB_OUTPUT"

      # A complete cache is around 1.6 GB, and a cache entry can never be
      # overwritten - every save is a new entry. Saving unconditionally would
      # therefore upload another 1.6 GB on every run, and since GitHub keeps only
      # 10 GB per repository and evicts the least recently used entries to stay
      # under it, a handful of runs would push out everything else, including the
      # Docker layer cache that keeps the image build short.
      #
      # Most runs change nothing at all, so a new copy is only uploaded when the
      # set of cached files is no longer the one that was restored.
      - name: ⛏️ Save static files to cache
        if: steps.cache-before.outputs.fingerprint != steps.cache-after.outputs.fingerprint
        uses: actions/cache/save@v4
        with:
          path: |
            imgs
            google_drive_cache
            docs
          key: ${{ runner.os }}-static-files-v4-${{ github.run_id }}

      # Deploy Frontend to GitHub Pages
      - name: Deploy 🚀 to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CEVI_ZH11_WEBPAGE }}'
          channelId: live
          projectId: cevi-zh11-webpage
