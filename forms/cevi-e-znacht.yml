# see backend/config/forms.yml for the corresponding mail address
receiver: cevi-e-znacht_receiver

# defines the input cells of the form
cells:

  - element: input
    label: Vorname
    required: true

  - element: input
    label: Nachname
    required: true

  - element: input
    label: Ceviname

  - element: input
    label: Mail
    type: email
    required: true

  - element: input
    label: Telefonnummer

  - element: input
    type: number
    label: Anzahl Personen

  - element: checkbox
    label: Ich möchte gerne vegetarisch essen

  - element: input
    label: Adresse
    required: true
    style_wide: true

  - element: checkbox
    label: Ich bin an einer <a href="/passiv-mitglied">Passivmitgliedschaft</a> interessiert

  - element: textarea
    label: Bemerkungen und Allergien
    style_wide: true
